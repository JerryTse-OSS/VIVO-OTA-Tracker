name: vivo-ota-tracker

on:
  workflow_dispatch:
    inputs:
      device_type:
        description: "phone 或 tablet"
        required: false
        default: "phone"
      model_sw_ver:
        description: "工程型号 PD号，如 PD2545"
        required: true
      device_model:
        description: "入网型号 V号，如 V2545A"
        required: true
      sw_version:
        description: "已知的基础系统版本号，如 16.1.16.5.W10"
        required: true
      android_ver:
        description: "Android/OriginOS 大版本号 (可选)"
        required: false
        default: ""
      is_full:
        description: "true=全量包 false=增量包 (留空则按机型类型走默认值)"
        required: false
        default: ""
      snp:
        description: "设备序列号占位 (可选)"
        required: false
        default: ""
      verbose:
        description: "是否打印详细调试信息"
        required: false
        default: "true"

jobs:
  fetch-ota:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (VivoOtaTracker.java + libvivoseckey_n4.so)
        uses: actions/checkout@v4
        with:
          path: tracker-src

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-unidbg-${{ hashFiles('unidbg/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-unidbg-

      - name: Clone unidbg framework
        env:
          # unidbg-ios 模块下的测试资源(ipa文件)走git-lfs，
          # 上游仓库自己的LFS配额经常被薅爆，我们只需要
          # unidbg-android + 核心模块，跳过LFS smudge即可，
          # 不影响构建(那些文件只是iOS模块的测试资源)。
          GIT_LFS_SKIP_SMUDGE: "1"
        run: git clone --depth 1 https://github.com/zhkl0228/unidbg.git

      - name: Diagnose native .so files (check for LFS pointer stubs)
        working-directory: unidbg
        run: |
          echo "== 扫描仓库内所有 .so 文件 =="
          FOUND_STUB=0
          while IFS= read -r f; do
            size=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$size" -lt 1000 ]; then
              echo "⚠️  疑似LFS指针文件 (体积仅 ${size} bytes): $f"
              echo "    内容预览: $(head -c 120 "$f" | tr -d '\n')"
              FOUND_STUB=1
            else
              echo "✅ 正常二进制 (${size} bytes): $f"
            fi
          done < <(find . -iname "*.so" -type f)
          echo "FOUND_STUB=${FOUND_STUB}" >> "$GITHUB_ENV"

      - name: Re-pull real native libs via git-lfs (skip huge iOS test assets)
        working-directory: unidbg
        if: env.FOUND_STUB == '1'
        run: |
          echo "检测到LFS指针stub，尝试只拉取 .so/.dll/.dylib，排除 unidbg-ios 测试资源..."
          git lfs pull \
            --include="**/*.so,**/*.dll,**/*.dylib" \
            --exclude="unidbg-ios/src/test/resources/**" \
          || echo "git lfs pull 失败(很可能是仓库级LFS配额本身就打满了，不分文件)，继续往下走，构建阶段会再次暴露问题"

          echo "== 重新检查 .so 体积 =="
          find . -iname "*.so" -type f -exec stat -c "%s %n" {} \;

      - name: Collect native library directories for java.library.path
        working-directory: unidbg
        run: |
          LIB_DIRS=$(find . -iname "*.so" -exec dirname {} \; | sort -u | sed 's#^\./##' | while read -r d; do echo "${GITHUB_WORKSPACE}/unidbg/${d}"; done | paste -sd ":")
          echo "LIB_DIRS=${LIB_DIRS}" >> "$GITHUB_ENV"
          echo "收集到的 native 库目录: ${LIB_DIRS}"

      - name: Place tool source & native lib into unidbg
        run: |
          mkdir -p unidbg/unidbg-android/src/main/java/com/vivo/ota
          mkdir -p unidbg/libs
          cp tracker-src/VivoOtaTracker.java unidbg/unidbg-android/src/main/java/com/vivo/ota/
          cp tracker-src/libvivoseckey_n4.so unidbg/libs/

      - name: Build unidbg (skip tests & gpg sign)
        working-directory: unidbg
        run: |
          chmod +x mvnw
          ./mvnw clean install -DskipTests -Dgpg.skip=true

      - name: Diagnose where unicorn_java native resource actually lives
        working-directory: unidbg
        run: |
          echo "== 1. 源码树里直接搜 unicorn_java / libunicorn =="
          find . -iname "*unicorn_java*" -o -iname "*libunicorn*" 2>/dev/null || true

          echo ""
          echo "== 2. 本地 Maven 仓库(~/.m2)里搜 unicorn 相关 jar =="
          find ~/.m2/repository -iname "*unicorn*" 2>/dev/null || true

          echo ""
          echo "== 3. 检查这些 jar 内部是否真的打包了 native 资源(.so/.dll/.dylib) =="
          find ~/.m2/repository -iname "*unicorn*.jar" 2>/dev/null | while read -r jar; do
            echo "--- $jar ---"
            unzip -l "$jar" 2>/dev/null | grep -iE "\.so$|\.dll$|\.dylib$|native" || echo "  (jar内未找到匹配的native资源)"
          done

          echo ""
          echo "== 4. unidbg-android 依赖树里 unicorn 相关依赖的 scope =="
          ./mvnw -q -pl unidbg-android dependency:tree -Dincludes=*unicorn* 2>&1 || true

      - name: Run VivoOtaTracker
        working-directory: unidbg
        env:
          DEVICE_TYPE: ${{ github.event.inputs.device_type }}
          MODEL_SW_VER: ${{ github.event.inputs.model_sw_ver }}
          DEVICE_MODEL: ${{ github.event.inputs.device_model }}
          SW_VERSION: ${{ github.event.inputs.sw_version }}
          ANDROID_VER: ${{ github.event.inputs.android_ver }}
          IS_FULL: ${{ github.event.inputs.is_full }}
          SNP: ${{ github.event.inputs.snp }}
          VERBOSE: ${{ github.event.inputs.verbose }}
          # 前面 "Collect native library directories" 步骤收集到的目录，
          # 兜底：万一 UnsatisfiedLinkError 是因为 java.library.path
          # 里压根没包含 .so 所在目录（而不是文件本身缺失/损坏）。
          MAVEN_OPTS: "-Djava.library.path=${{ env.LIB_DIRS }}"
        run: |
          ARGS="-Dexec.mainClass=com.vivo.ota.VivoOtaTracker"
          # 尝试性修复: 打包 unicorn native 资源的依赖可能只在 test scope，
          # exec:java 默认classpath不含test，这里强制带上test scope试一次。
          ARGS="$ARGS -Dexec.classpathScope=test"
          ARGS="$ARGS -DDEVICE_TYPE=${DEVICE_TYPE:-phone}"
          ARGS="$ARGS -DMODEL_SW_VER=${MODEL_SW_VER}"
          ARGS="$ARGS -DDEVICE_MODEL=${DEVICE_MODEL}"
          ARGS="$ARGS -DSW_VERSION=${SW_VERSION}"
          [ -n "$ANDROID_VER" ] && ARGS="$ARGS -DANDROID_VER=${ANDROID_VER}"
          [ -n "$IS_FULL" ] && ARGS="$ARGS -DIS_FULL=${IS_FULL}"
          [ -n "$SNP" ] && ARGS="$ARGS -DSNP=${SNP}"
          [ -n "$VERBOSE" ] && ARGS="$ARGS -DVERBOSE=${VERBOSE}"

          echo "MAVEN_OPTS=${MAVEN_OPTS}"
          echo "Running: ./mvnw exec:java -pl unidbg-android $ARGS"
          ./mvnw exec:java -pl unidbg-android $ARGS 2>&1 | tee "${GITHUB_WORKSPACE}/tracker_output.log"

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## vivo OTA Tracker 输出"
            echo '```'
            tail -n 150 "${GITHUB_WORKSPACE}/tracker_output.log" 2>/dev/null || echo "(no log captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vivo-ota-result-${{ github.run_number }}
          path: tracker_output.log
          retention-days: 7
