name: vivo-ota-tracker

on:
  workflow_dispatch:
    inputs:
      device_type:
        description: "phone 或 tablet"
        required: false
        default: "phone"
      model_sw_ver:
        description: "工程型号 PD号，如 PD2545"
        required: true
      device_model:
        description: "入网型号 V号，如 V2545A"
        required: true
      sw_version:
        description: "已知的基础系统版本号，如 16.1.16.5.W10"
        required: true
      android_ver:
        description: "Android/OriginOS 大版本号 (可选)"
        required: false
        default: ""
      is_full:
        description: "true=全量包 false=增量包 (留空则按机型类型走默认值)"
        required: false
        default: ""
      snp:
        description: "设备序列号占位 (可选)"
        required: false
        default: ""
      verbose:
        description: "是否打印详细调试信息"
        required: false
        default: "true"

jobs:
  fetch-ota:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (VivoOtaTracker.java + libvivoseckey_n4.so)
        uses: actions/checkout@v4
        with:
          path: tracker-src

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: \~/.m2/repository
          key: \( {{ runner.os }}-m2-unidbg- \){{ hashFiles('unidbg/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-unidbg-

      - name: Clone unidbg framework
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: git clone --depth 1 https://github.com/zhkl0228/unidbg.git

      - name: Place tool source & native lib into unidbg
        run: |
          mkdir -p unidbg/unidbg-android/src/main/java/com/vivo/ota
          mkdir -p unidbg/libs
          cp tracker-src/VivoOtaTracker.java unidbg/unidbg-android/src/main/java/com/vivo/ota/
          cp tracker-src/libvivoseckey_n4.so unidbg/libs/

      - name: Force unicorn2 to compile scope
        working-directory: unidbg
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("unidbg-android/pom.xml")
          text = p.read_text()
          # 只删掉 unidbg-unicorn2 依赖块里的 <scope>test</scope>
          text2, n = re.subn(
              r'(<artifactId>unidbg-unicorn2</artifactId>\s*<version>\$\{project\.version\}</version>)\s*<scope>test</scope>',
              r'\1',
              text,
              count=1
          )
          if n == 0:
              raise SystemExit("unidbg-unicorn2 test scope not found")
          p.write_text(text2)
          print("removed <scope>test</scope> for unidbg-unicorn2")
          PY
          grep -A8 'unidbg-unicorn2' unidbg-android/pom.xml

      - name: Switch VivoOtaTracker to Unicorn2 backend
        working-directory: unidbg
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("unidbg-android/src/main/java/com/vivo/ota/VivoOtaTracker.java")
          text = p.read_text()

          # 1. 确保 import 存在（插在 AndroidEmulatorBuilder 那行后面）
          if "Unicorn2Factory" not in text:
              text = text.replace(
                  "import com.github.unidbg.linux.android.AndroidEmulatorBuilder;",
                  "import com.github.unidbg.linux.android.AndroidEmulatorBuilder;\n"
                  "import com.github.unidbg.arm.backend.Unicorn2Factory;",
                  1
              )

          # 2. 统一替换构造函数里的 emulator 初始化
          text = re.sub(
              r'emulator\s*=\s*AndroidEmulatorBuilder\.for64Bit\(\)[\s\S]*?\.build\(\);',
              'emulator = AndroidEmulatorBuilder.for64Bit()\n'
              '                .setProcessName("com.bbk.updater")\n'
              '                .addBackendFactory(new Unicorn2Factory(true))\n'
              '                .build();',
              text,
              count=1
          )

          p.write_text(text)
          print("VivoOtaTracker updated successfully")
          print("--- import ---")
          for i, line in enumerate(text.splitlines(), 1):
              if "Unicorn2Factory" in line or "AndroidEmulatorBuilder" in line:
                  print(f"{i}: {line}")
          print("--- constructor ---")
          for i, line in enumerate(text.splitlines(), 1):
              if "for64Bit" in line or "Unicorn2Factory(true)" in line or "setProcessName" in line:
                  print(f"{i}: {line}")
          PY

      - name: Build unidbg (skip tests & gpg sign)
        working-directory: unidbg
        run: |
          chmod +x mvnw
          ./mvnw clean install -DskipTests -Dgpg.skip=true

      - name: Run VivoOtaTracker
        working-directory: unidbg
        env:
          DEVICE_TYPE: ${{ github.event.inputs.device_type }}
          MODEL_SW_VER: ${{ github.event.inputs.model_sw_ver }}
          DEVICE_MODEL: ${{ github.event.inputs.device_model }}
          SW_VERSION: ${{ github.event.inputs.sw_version }}
          ANDROID_VER: ${{ github.event.inputs.android_ver }}
          IS_FULL: ${{ github.event.inputs.is_full }}
          SNP: ${{ github.event.inputs.snp }}
          VERBOSE: ${{ github.event.inputs.verbose }}
        run: |
          set -e
          CMD=(./mvnw exec:java -pl unidbg-android
            -Dexec.mainClass=com.vivo.ota.VivoOtaTracker
            -DDEVICE_TYPE="${DEVICE_TYPE:-phone}"
            -DMODEL_SW_VER="${MODEL_SW_VER}"
            -DDEVICE_MODEL="${DEVICE_MODEL}"
            -DSW_VERSION="${SW_VERSION}"
          )
          [ -n "$ANDROID_VER" ] && CMD+=(-DANDROID_VER="$ANDROID_VER")
          [ -n "$IS_FULL" ] && CMD+=(-DIS_FULL="$IS_FULL")
          [ -n "$SNP" ] && CMD+=(-DSNP="$SNP")
          [ -n "$VERBOSE" ] && CMD+=(-DVERBOSE="$VERBOSE")

          echo "Running: ${CMD[*]}"
          "\( {CMD[@]}" 2>&1 | tee " \){GITHUB_WORKSPACE}/tracker_output.log"
          
      - name: Write job summary
        if: always()
        run: |
          {
            echo "## vivo OTA Tracker 输出"
            echo '```'
            tail -n 150 "${GITHUB_WORKSPACE}/tracker_output.log" 2>/dev/null || echo "(no log captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vivo-ota-result-${{ github.run_number }}
          path: tracker_output.log
          retention-days: 7
